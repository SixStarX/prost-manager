server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip para os assets
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # API: repassa /api/* para o backend (mesmo rewrite do dev: remove o /api).
  # "server" é o nome do serviço do backend no docker-compose.
  location /api/ {
    proxy_pass http://server:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: qualquer rota desconhecida cai no index.html (React Router).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets com hash no nome podem ter cache longo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
